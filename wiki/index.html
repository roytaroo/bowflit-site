<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BOWFLIT 公式Wiki</title>
<meta name="description" content="BOWFLIT の公式Wiki。ユニークの能力・ストーリー・相性・テクニック・対処法、ランクと熟練度、コスメの一覧。">
<link rel="icon" href="../assets/heads/jack.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 公式サイトと同じ見た目(ほぼ黒・紫の差し色・斜めに切った角)。読みやすさ優先で文字は少し大きめ */
:root{
  --bg:#07080c; --bg2:#0e1018; --bg3:#151826; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.18);
  --ink:#eeedf5; --sub:#8d91a6; --accent:#a24bff; --accent2:#c58bff; --good:#5fe08a; --bad:#ff5a6a; --gold:#ffc446;
  --en:"Bebas Neue","Zen Kaku Gothic New",sans-serif; --ui:"Rajdhani","Zen Kaku Gothic New",sans-serif; --jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:var(--jp);font-weight:500;font-size:15.5px;line-height:1.85;-webkit-font-smoothing:antialiased}
a{color:var(--accent2)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.px{image-rendering:pixelated}
/* 上のバー */
header{position:sticky;top:0;z-index:30;background:rgba(7,8,12,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;gap:18px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.brand img{height:24px;width:auto;display:block}
.brand b{font-family:var(--en);font-weight:400;font-size:22px;letter-spacing:.08em;color:var(--accent2);line-height:1}
header nav{display:flex;gap:22px;margin-left:auto}
header nav a{font-family:var(--ui);font-weight:700;font-size:14px;letter-spacing:.12em;color:var(--sub);text-decoration:none;text-transform:uppercase}
header nav a:hover,header nav a.on{color:#fff}
.search{position:relative;flex:none}
.search input{width:180px;font:inherit;font-size:14px;color:var(--ink);background:var(--bg3);border:1px solid var(--line2);padding:6px 10px}
.menu-btn{display:none;width:40px;height:40px;border:1px solid var(--line2);background:transparent;color:#fff;cursor:pointer;flex:none}
.menu-btn svg{width:20px;height:20px;display:block;margin:auto}
@media (max-width:900px){
  header nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;gap:0;background:#07080c;border-bottom:1px solid var(--line);padding:6px 18px 12px;margin:0}
  header.open nav{display:flex}
  header nav a{padding:12px 0;border-bottom:1px solid var(--line)}
  .menu-btn{display:block;margin-left:auto}
  .search input{width:130px}
}
@media (max-width:420px){.brand img{display:none}.search input{width:110px}}
.results{position:absolute;right:0;top:calc(100% + 4px);width:min(320px,80vw);background:var(--bg2);border:1px solid var(--line2);z-index:40;max-height:60vh;overflow:auto}
.results a{display:flex;gap:10px;align-items:center;padding:8px 12px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);font-size:14px}
.results a:hover{background:var(--bg3)}
.results img{width:24px;height:24px}
.results small{color:var(--sub);margin-left:auto}
/* 共通 */
main{min-height:70vh;padding-bottom:80px}
.crumb{font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--sub);margin:22px 0 8px}
.crumb a{color:var(--sub);text-decoration:none}.crumb a:hover{color:#fff}
h1.t{font-family:var(--en);font-weight:400;font-size:clamp(48px,8vw,96px);line-height:.9;margin:0 0 8px;letter-spacing:.02em}
h1.t i{font-style:normal;color:var(--accent)}
.lead{color:var(--sub);max-width:46em;margin:0 0 30px}
h2.s{font-weight:900;font-size:20px;margin:44px 0 14px;display:flex;align-items:center;gap:12px}
h2.s::before{content:"";width:10px;height:10px;background:var(--accent);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);flex:none}
h2.s small{font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.18em;color:var(--sub);text-transform:uppercase}
.card{background:var(--bg2);border:1px solid var(--line);padding:18px 20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.tabs button{font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:.1em;border:1px solid var(--line2);background:transparent;color:var(--sub);padding:6px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
/* ホーム */
.home-hero{position:relative;padding:40px 0 10px}
.story{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center}
.story p{margin:0 0 12px;color:#c9cbd8}
.story .cast{display:flex;justify-content:center;align-items:flex-end}
.story .cast img{width:30%;margin:0 -5%}
.story .cast img:nth-child(2){width:38%;z-index:1}
@media (max-width:760px){.story{grid-template-columns:minmax(0,1fr)}.story .cast{order:-1;max-width:360px;margin:0 auto}}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:30px}
.quick a{display:block;background:var(--bg2);border:1px solid var(--line);padding:16px 18px;text-decoration:none;color:var(--ink);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.quick a:hover{border-color:var(--accent);background:var(--bg3)}
.quick b{display:block;font-family:var(--en);font-weight:400;font-size:28px;letter-spacing:.04em;line-height:1}
.quick span{font-size:13px;color:var(--sub)}
@media (max-width:760px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ユニーク一覧 */
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:10px}
.ucard{position:relative;display:block;background:var(--bg2);border:1px solid var(--line);text-decoration:none;color:var(--ink);overflow:hidden;transition:border-color .15s,transform .15s}
.ucard:hover{border-color:var(--uc);transform:translateY(-2px)}
.ucard .pic{aspect-ratio:4/5;display:grid;place-items:end center;background:radial-gradient(70% 60% at 50% 70%,color-mix(in srgb,var(--uc) 40%,transparent),transparent 70%);border-bottom:3px solid var(--uc)}
.ucard .pic{position:relative}.ucard .pic img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:92%;width:auto;max-width:none}
.ucard .nm{padding:8px 12px 10px}
.ucard b{font-family:var(--en);font-weight:400;font-size:26px;letter-spacing:.04em;line-height:1;display:block}
.ucard span{font-size:12.5px;color:var(--sub)}
.ucard .role{position:absolute;left:8px;top:8px;font-family:var(--ui);font-weight:700;font-size:11px;letter-spacing:.12em;background:rgba(7,8,12,.75);padding:2px 8px;color:var(--uc)}
/* ユニークのページ */
.uhead{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:32px;align-items:end;margin-top:6px}
.uhead .pic{aspect-ratio:3/4;display:grid;place-items:end center;background:radial-gradient(60% 55% at 50% 65%,color-mix(in srgb,var(--uc) 45%,transparent),transparent 70%);border-bottom:3px solid var(--uc)}
.uhead .pic{position:relative;overflow:hidden}.uhead .pic img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:94%;width:auto;max-width:none}
.uhead .motif{font-weight:700;color:var(--uc);margin:0}
.uhead h1{font-family:var(--en);font-weight:400;font-size:clamp(64px,10vw,120px);line-height:.85;margin:4px 0 6px;letter-spacing:.02em}
.uhead .catch{font-weight:900;font-size:18px;margin:0 0 16px}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.meta div{background:var(--bg2);border:1px solid var(--line);padding:6px 14px}
.meta span{display:block;font-family:var(--ui);font-weight:700;font-size:11px;letter-spacing:.16em;color:var(--sub)}
.meta b{font-family:var(--en);font-weight:400;font-size:24px;letter-spacing:.04em;line-height:1.1}
.stars{color:var(--gold);letter-spacing:.1em}
.ability{border-left:3px solid var(--uc);padding:4px 0 4px 16px;color:#d6d8e4;margin:0}
@media (max-width:760px){.uhead{grid-template-columns:minmax(0,1fr)}.uhead .pic{max-width:260px;margin:0 auto;width:100%}}
.toc{display:flex;gap:6px;flex-wrap:wrap;margin:26px 0 0;position:sticky;top:60px;z-index:5;background:rgba(7,8,12,.9);padding:8px 0;border-bottom:1px solid var(--line)}
.toc a{font-size:13px;font-weight:700;color:var(--sub);text-decoration:none;border:1px solid var(--line2);padding:3px 10px}
.toc a:hover{color:#fff;border-color:var(--uc)}
.lore{font-size:16px;color:#d6d8e4;max-width:46em}
.rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:10px}
.rel a,.mu a{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-items:start;background:var(--bg2);border:1px solid var(--line);padding:14px 16px;text-decoration:none;color:var(--ink)}
.rel a:hover,.mu a:hover{border-color:var(--line2);background:var(--bg3)}
.rel img,.mu img{width:48px;height:48px}
.rel b,.mu b{font-weight:900}
.rel em{font-style:normal;font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--accent2);margin-left:8px}
.rel p,.mu p{margin:2px 0 0;color:var(--sub);font-size:14.5px}
.mu{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.mu h3{font-family:var(--ui);font-weight:700;font-size:14px;letter-spacing:.16em;margin:0 0 8px}
.mu .g h3{color:var(--good)}.mu .b h3{color:var(--bad)}
.mu .g a{border-left:3px solid var(--good)}.mu .b a{border-left:3px solid var(--bad)}
.mu > div{display:grid;gap:8px;align-content:start}
@media (max-width:760px){.mu{grid-template-columns:minmax(0,1fr)}}
.tips{counter-reset:t;display:grid;gap:8px;margin:0;padding:0;list-style:none}
.tips li{counter-increment:t;display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;background:var(--bg2);border:1px solid var(--line);padding:12px 16px}
.tips li::before{content:counter(t,decimal-leading-zero);font-family:var(--en);font-size:26px;line-height:1.1;color:var(--uc,var(--accent2))}
.tips.ct li::before{color:var(--bad)}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:40px}
.pn a{display:flex;overflow:hidden;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:var(--bg2);border:1px solid var(--line);padding:10px 14px;min-width:0}
.pn a:hover{border-color:var(--line2)}
.pn img{width:32px;height:32px}
.pn span{font-family:var(--en);font-size:22px;letter-spacing:.04em}
/* 表 */
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th,.tbl td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--sub);text-transform:uppercase;white-space:nowrap}
.tbl td.num{font-family:var(--en);font-size:20px;letter-spacing:.04em;white-space:nowrap}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--bg2)}
.rar{font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.08em;padding:1px 8px;border:1px solid currentColor;white-space:nowrap}
.basic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}
.basic-grid .card b{display:block;font-weight:900;margin-bottom:4px}
.basic-grid .card .k{font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.16em;color:var(--accent2)}
.basic-grid .card p{margin:0;color:var(--sub);font-size:14.5px}
.empty{color:var(--sub)}
footer{border-top:1px solid var(--line);color:var(--sub);font-size:12.5px;padding-block:22px calc(22px + env(safe-area-inset-bottom,0px))}
footer .wrap{display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap}
</style>
</head>

"A", "min": 500}, {"id": "A+", "min": 650}, {"id": "S", "min": 1200}, {"id": "S+", "min": 2500}, {"id": "Z", "min": 5000}, {"id": "Ω", "min": 10000, "wins": 2000}], "uniques": [{"id": "jack", "name": "Jack", "motif": "スライム", "ct": 8, "desc": "大ジャンプができる。スニークしながらだと低く横へ跳ぶ。着地の瞬間にしゃがんでいると、もう一度跳ねる(横跳びは同じ長さ・大ジャンプは半分の高さ)。奈落に落ちかけても跳んで戻れる"}, {"id": "humming", "name": "Humming", "motif": "ハチ", "ct": 12, "desc": "使うたびに小爆発で跳ぶ。最初に使ってから5秒間・5回まで。跳んだ回数が少ないほど、次のクールタイムが短い(4〜12秒)。持ってスニークで羽ばたいてゆっくり落ちる"}, {"id": "jester", "name": "Jester", "motif": "ピエロ", "ct": 12, "desc": "見ている相手と位置を入れ替える。入れ替えられた相手は後ろを向く"}, {"id": "shade", "name": "Shade", "motif": "小悪魔", "ct": 13, "desc": "鎧を外して8秒間透明になる。使うと全員に知らせが出る。透明中は視界が暗い。終わると鎧が戻る"}, {"id": "rampart", "name": "Rampart", "motif": "カメ", "ct": 0, "desc": "敵を倒すと鎧がもらえる。金ブロックの上で使うと、5秒ためて1回だけ鎧を作れる(試合ごと)"}, {"id": "widow", "name": "Widow", "motif": "クモ", "ct": 19, "desc": "見ている所(40マスまで)に糸を刺して、振り子のようにぶら下がって移動する。しゃがむと糸を巻き取る(合計3秒で焼き切れる)。糸は10秒、もう一度使うと外せる"}, {"id": "pierce", "name": "Pierce", "motif": "ハリネズミ", "ct": 15, "desc": "まわりを3匹のハリネズミが走り回る。使うたびに1匹が丸まって飛んでいく。当たった相手はノックバック、鎧を着ていたら鎧が壊れる(鎧がなければ一瞬遅くなる)。3匹投げると15秒後に全員帰ってくる"}, {"id": "echo", "name": "Echo", "motif": "コウモリ", "ct": 18, "desc": "前後左右の4方向にシュルカーを飛ばす。どれかを見ながらもう一度使うとそこへ転移し、まわりの相手を盲目にする。時間内なら残りのシュルカーにも続けて転移できる。アイテムを持って殴ると残りを回収して、残した数が多いほどクールタイムが短い(3〜18秒)"}, {"id": "meteor", "name": "Meteor", "motif": "宇宙人", "ct": 12, "desc": "見ている所に巨大なブロック(約7.5×7.5×7.5)を10秒置く。自分には見えない(ふちだけ見える)。中にいる相手は盲目になり、ユニークが使えない"}, {"id": "oracle", "name": "Oracle", "motif": "スケルトン", "ct": 15, "desc": "見ている所のまわり(半径7)の壁を8秒間 透明にする(ぶつかるのはそのまま)。範囲の中の相手が自分にだけ光って見え、自分の矢は範囲の中のブロックを通り抜ける"}, {"id": "replica", "name": "Replica", "motif": "キツネ", "ct": 10, "desc": "自分と同じ姿の分身を20秒出す。分身は2秒まっすぐ歩き、そのあとは自分と同じ動きをする。分身が出ている間に使うと、分身を自分のところへ呼び戻せる。分身を撃った相手は3秒盲目になる。分身が倒されるとクールタイム3秒、20秒倒されなければクールタイム10秒"}, {"id": "splash", "name": "Splash", "motif": "カエル", "ct": 18, "desc": "8秒間 足が速くなりジャンプ力が上がる。その間はダイヤブロックのブリンクも強くなる。クールタイム中に空中で使うと、見ている方向の斜め下へ加速する(着地するまで1回)"}, {"id": "byte", "name": "Byte", "motif": "テレビ", "ct": 20, "desc": "まわり(半径4)のダイヤブロック・エメラルドブロックを8秒ハッキングする。ハッキング中は見た目が変わり、自分が乗るとブリンク・アップドラフトが強くなる。他の人が乗っても反応しない"}, {"id": "wormhole", "name": "Astro", "motif": "ポータルガン", "ct": 20, "desc": "使うたびに見ている所(40マスまで)へゲートを置く(2つ)。2つのゲートはつながっていて、くぐると向きと勢いを保ったまま反対のゲートから出る。矢もくぐる。敵も使える。ゲートは12秒"}, {"id": "mason", "name": "Sprout", "motif": "パンダ", "ct": 10, "desc": "見ている所(40マスまで)に柱(2×2・高さ6)を地面からせり上げる。しゃがんで使うか足元を見て使うと、自分の真下から生えて高い所へ持ち上がる。足場にも、矢をふせぐ盾にもなる。柱でのウォールキックなどのキャラコンは、Sprout なら食料ゲージが減らない。3本までためておけて、10秒ごとに1本もどる。4本目を立てると一番古い柱が消える"}, {"id": "chef", "name": "Olive", "motif": "シェフ", "ct": 6, "desc": "見ている方へピザ生地を投げる。生地は12マス飛ぶか壁の手前で止まり、空中で5秒回り続ける。自分が上から乗ると大きく跳ねる(勢いはそのまま)。3枚まで置けて、4枚目で一番古い生地が消える。3枚までためておけて、6秒ごとに1枚もどる"}], "ranks": [{"label": "壱段", "min": 0}, {"label": "弐段", "min": 300}, {"label": "参段", "min": 700}, {"label": "肆段", "min": 1200}, {"label": "伍段", "min": 1700}, {"label": "陸段", "min": 2100}]}, "uniques": {"_説明": "wiki のユニークのページの中身(手で書く所)。能力・クールタイムはゲームから自動で入る(game.json)。ここを直して tools/wiki_build.py を流すか、公開リポジトリの wiki/data/uniques.json を直接直す", "world": {"title": "空の弓闘会 BOWFLIT", "body": ["雲より高い所に浮かぶ島々。そこでは年に何度も、弓だけで戦う大会「BOWFLIT(ボウフリット)」が開かれる。", "ルールはひとつ。2発当てられたら負け、島から落ちても負け。剣も魔法の杖もない。持てるのは弓と、生まれつきの力「ユニーク」だけ。", "集まるのは、スライムの体を持つ少年から、遠い星から来た宇宙人、テレビの体を持つ機械まで。ねらいは賞品か、名誉か、ただのひまつぶしか。それぞれの理由を胸に、今日も誰かが島に降り立つ。"]}, "uniques": {"jack": {"role": "移動", "difficulty": 1, "catch": "どこまでも跳ねる、スライムの少年", "lore": "スライムの沼で育った、体が半分スライムの少年。落ち着きがなく、話しているあいだもずっと跳ねている。BOWFLIT に出るのは「いちばん高く跳んだやつが勝ち」だと勘ちがいしているから。それでも勝っているので、本人は気にしていない。", "relations": [{"with": "splash", "kind": "ライバル", "text": "跳ぶ高さで張り合う仲。Splash に「跳ぶのはぼくらカエルの仕事」と言われてから、毎試合こっそり高さを比べている。"}, {"with": "chef", "kind": "お得意さん", "text": "Olive のピザ生地の上で跳ねるのが大好き。食べ物で遊ぶなと毎回しかられている。"}], "good": [{"vs": "pierce", "why": "ハリネズミに当たって島から押し出されても、大ジャンプで戻ってこられる。"}, {"vs": "widow", "why": "糸で追いかけられても、真上に跳べば振り子の外に出られる。高い所の取り合いで負けにくい。"}], "bad": [{"vs": "meteor", "why": "ブロックの中に閉じこめられるとユニークが使えず、自慢のジャンプで逃げられない。"}, {"vs": "oracle", "why": "跳んでいる間は動きが読みやすく、壁ごしに光って見えると着地をねらわれる。"}], "tech": ["着地の瞬間にしゃがんでおくと、もう一度跳ねる。大ジャンプ → 着地しゃがみで、2回分の高さを稼げる。", "スニークしながら使うと低く横へ跳ぶ。撃ち合いの最中に横へずれて、相手の矢を外させる。", "奈落に落ちかけた時の保険にクールタイムを残しておく。攻めで使い切らないのが上級者。"], "counter": ["跳んだ瞬間ではなく、落ちてくる着地点をねらう。空中では向きを変えられない。", "使った直後の8秒はただの人。クールタイム中に詰める。", "Meteor のブロックや Jester の入れ替えで、跳ぶ前の場所に閉じこめる。"]}, "humming": {"role": "移動", "difficulty": 2, "catch": "羽音と爆発で空を飛ぶ、ハチの子", "lore": "巨大な巣で暮らすハチの一族の末っ子。羽が小さくて飛べないかわりに、お尻の小さな爆発で跳ぶ方法を自分で編み出した。巣のみんなに「それは飛んでるんじゃなくて落ちてるだけ」と笑われたのがくやしくて、空の大会で見返そうとしている。", "relations": [{"with": "mason", "kind": "ご近所", "text": "Sprout の竹林の近くに巣がある。柱の上はちょうどいい休けい場所。"}, {"with": "echo", "kind": "苦手", "text": "夜の洞窟育ちの Echo とは生活リズムが真逆。試合が夜にあると調子が出ない。"}], "good": [{"vs": "widow", "why": "5回の小ジャンプで向きを細かく変えられるので、糸で追ってくる相手を空中で振り切れる。"}, {"vs": "jester", "why": "入れ替えられて後ろを向かされても、すぐ跳んで位置を立て直せる。"}], "bad": [{"vs": "oracle", "why": "空中で長く浮いている分、光って見えると矢を当てられやすい。"}, {"vs": "byte", "why": "Byte が乗っ取ったブロックは使えない。着地点のダイヤ・エメラルドを封じられると動きが止まる。"}], "tech": ["跳ぶ回数が少ないほど次のクールタイムが短い(4〜12秒)。2回で足りる時は2回でやめる。", "持ってスニークで羽ばたいてゆっくり落ちる。高い所から相手の上を取って、落ちながら撃つ。", "1回目を移動、2回目以降を相手の矢をかわすために取っておくと、撃ち合いで負けにくい。"], "counter": ["ゆっくり落ちている間は的が大きい。上を見て待つ。", "5秒の間に5回まで。数えておいて、使い切った所をねらう。", "下から追わず、着地しそうな足場の近くで待ち伏せる。"]}, "widow": {"role": "移動", "difficulty": 3, "catch": "糸で空を渡る、物静かなクモ", "lore": "古い廃坑の奥に住む、口数の少ないクモ。島から島へ糸を張って渡る姿は「空の振り子」と呼ばれている。大会に出る理由は誰も知らないが、試合のあとはいつも島の天井に糸を張って昼寝している。", "relations": [{"with": "echo", "kind": "夜の友だち", "text": "同じ洞窟の暗がりで育った幼なじみ。言葉が少なくても通じ合う。"}, {"with": "jack", "kind": "うるさい", "text": "昼寝の糸の上で跳ねられたことがある。それ以来、Jack を見ると少し距離を取る。"}], "good": [{"vs": "meteor", "why": "ブロックが落ちてきても、40マス先に糸を刺して一気に逃げられる。"}, {"vs": "rampart", "why": "高い所から振り子で回りこみ、守りの固い相手の真上や後ろを取れる。"}], "bad": [{"vs": "jester", "why": "振り子の途中で入れ替えられると、相手の場所(多くは地上)に落とされて勢いを全部失う。"}, {"vs": "pierce", "why": "振り子の道すじは読みやすく、ハリネズミのノックバックで糸の外へはじかれる。"}], "tech": ["しゃがむと糸を巻き取って一気に近づく。巻き取りは合計3秒で焼き切れるので、短く何回かに分ける。", "振り子の一番下で撃つと体がぶれにくい。上に振り上がる時は撃たずに位置を取る。", "糸は10秒。もう一度使うと外せるので、ほしい高さで外して飛び出す。"], "counter": ["振り子は行って戻る。戻ってくる所に先に矢を置いておく。", "クールタイムが19秒と長い。外した直後はしばらく動けない。", "糸を刺す先(高い壁・天井)の近くに立っておくと、移動先をつぶせる。"]}, "splash": {"role": "移動", "difficulty": 2, "catch": "本気を出すと誰より速い、池のカエル", "lore": "空の島の小さな池で育ったカエル。ふだんはのんびりしていて、試合が始まってもしばらく日なたぼっこをしている。ところが一度「本気」になると、8秒だけ誰も追いつけない速さになる。その8秒を見たくて、ファンが増えている。", "relations": [{"with": "jack", "kind": "ライバル", "text": "跳ぶのは自分たちの仕事だと思っている。Jack がうらやましくて、つい張り合ってしまう。"}, {"with": "byte", "kind": "相棒", "text": "Byte が乗っ取ったダイヤブロックの上でブリンクすると、とんでもなく遠くまで行ける。2人で練習していたことがある。"}], "good": [{"vs": "shade", "why": "透明になって近づかれても、足の速さで距離を取り直せる。"}, {"vs": "oracle", "why": "壁ごしに光って見えても、8秒の速さで射線から外れられる。"}], "bad": [{"vs": "meteor", "why": "ブロックの中ではユニークが使えない。速さが命なので、止められると弱い。"}, {"vs": "rampart", "why": "鎧をため直す相手には、一気に攻めても押し切れないことが多い。"}], "tech": ["8秒の間はダイヤブロックのブリンクも強くなる。ダイヤブロックが多い場所で使う。", "クールタイム中でも、空中で使うと見ている方向の斜め下へ加速する(着地まで1回)。追いかけっこの最後の一押しに。", "使う前に逃げ道を決めておく。8秒は短い。"], "counter": ["使った直後の8秒は追わない。終わってから18秒のクールタイムをねらう。", "ダイヤブロックの近くを先に取っておく。", "Meteor のブロックで閉じこめると、速さが全部止まる。"]}, "shade": {"role": "奇襲", "difficulty": 3, "catch": "消えて現れる、目立ちたがりの小悪魔", "lore": "いたずらが大好きな小悪魔。姿を消すことができるのに、消えるたびに「今から消えるよ!」とみんなに知らせてしまう。本人いわく「知られていても見つからないのが一流」。消えている間は自分の目も暗くなるのが悩み。", "relations": [{"with": "jester", "kind": "いたずら仲間", "text": "2人そろうと試合がめちゃくちゃになる。観客には大人気。"}, {"with": "oracle", "kind": "天敵", "text": "Oracle の前では消えても光って見えてしまう。Shade がいちばん会いたくない相手。"}], "good": [{"vs": "widow", "why": "振り子で動き回る相手の真下に、消えたまま回りこめる。"}, {"vs": "rampart", "why": "守りを固めて待つ相手に、見えないまま近づいて先に当てられる。"}], "bad": [{"vs": "oracle", "why": "Oracle の範囲の中では光って見える。消えている意味がなくなる。"}, {"vs": "echo", "why": "シュルカーで転移してきて盲目にされると、暗い視界がさらに見えなくなる。"}], "tech": ["使うと全員に知らせが出る。あえて逆方向に走ってから回りこむと読まれにくい。", "透明中は鎧がない。1発で負けるので、撃ち合いではなく、見つかる前に当てる。", "8秒が終わると鎧が戻る。消えている間に安全な場所へ動き、鎧が戻ってから戦うのもあり。"], "counter": ["知らせが出たら、自分の背中を壁につけて回りこまれないようにする。", "透明中は鎧がない。1発当てれば勝てる。足音や矢の飛んでくる方向で見当をつける。", "Oracle がいれば、範囲の中で光って丸見えになる。"]}, "jester": {"role": "妨害", "difficulty": 3, "catch": "入れ替えて、からかう道化師", "lore": "旅回りの一座から逃げ出してきたピエロ。人をからかうのが生きがいで、相手と場所を入れ替えて、きょとんと後ろを向く顔を見るのがたまらなく好き。勝ち負けより、相手がどれだけ驚いたかを数えている。", "relations": [{"with": "shade", "kind": "いたずら仲間", "text": "Shade とは息がぴったり。2人で組むと誰も手がつけられない。"}, {"with": "replica", "kind": "化かし合い", "text": "入れ替えたと思ったら分身だった。そんなことが何度もあって、Replica にだけは本気で張り合う。"}], "good": [{"vs": "widow", "why": "振り子の途中の相手と入れ替えると、相手は地上(自分のいた所)に落とされて勢いを失う。"}, {"vs": "rampart", "why": "金ブロックの上で鎧をためている相手を、まるごと別の場所へ飛ばせる。"}], "bad": [{"vs": "replica", "why": "入れ替えた相手が分身だと、自分だけが危ない場所に飛ぶ。"}, {"vs": "meteor", "why": "ブロックの中ではユニークが使えず、見ている相手も見えない。"}], "tech": ["入れ替えられた相手は後ろを向く。入れ替えた直後の、相手が振り向く前が当てどき。", "高い所の相手と入れ替えれば、自分が高い所を取れる。島のはしの相手と入れ替えれば、相手を落とし場所に送れる。", "仲間が危ない時は、敵と入れ替えて敵を仲間から引きはがす。"], "counter": ["Jester に見られている時は、島のはしや高い所に立たない。", "入れ替えられたらすぐ振り向く。後ろに Jester がいる。", "クールタイムは12秒。入れ替えた直後に撃ち返せば、相手は次の手がない。"]}, "replica": {"role": "かく乱", "difficulty": 4, "catch": "本物はどっち? 分身使いのキツネ", "lore": "森でいちばんずる賢いと言われるキツネ。自分そっくりの分身を作れるので、相手が分身を撃っているあいだに本物は背中に回っている。分身を撃った相手はしばらく目がくらむ。本人は「だまされる方が悪い」が口ぐせ。", "relations": [{"with": "jester", "kind": "化かし合い", "text": "どっちがより人を驚かせられるか、ずっと勝負している。今のところ引き分け。"}, {"with": "oracle", "kind": "やりにくい", "text": "Oracle の前では本物だけが光って見えてしまう。森の外でいちばん苦手な相手。"}], "good": [{"vs": "jester", "why": "分身と入れ替えさせれば、Jester だけが危ない所へ飛ぶ。"}, {"vs": "meteor", "why": "分身にブロックを使わせれば、本物は外から自由に撃てる。"}], "bad": [{"vs": "oracle", "why": "範囲の中では本物だけが光るので、分身が意味をなくす。"}, {"vs": "pierce", "why": "ハリネズミは数を投げられる。分身と本物の両方に当てられやすい。"}], "tech": ["分身は2秒まっすぐ歩いたあと、自分と同じ動きをする。自分が止まれば分身も止まるので、2人で並んで撃っているように見せる。", "分身が出ている間にもう一度使うと、分身を手元に呼び戻せる。逃げ道に置いた分身を戻して身代わりに。", "分身が倒されるとクールタイムは3秒。わざと撃たせて、すぐ次を出す。"], "counter": ["同じ動きをしている2人のうち、少し遅れて動く方が分身。", "分身を撃つと3秒目がくらむ。あやしい時は撃たずに、動きを見てから。", "Oracle の範囲なら本物だけが光る。"]}, "meteor": {"role": "妨害", "difficulty": 2, "catch": "空から箱を落とす、遠い星の宇宙人", "lore": "遠い星から観光に来た宇宙人。地球の「ブロック」がめずらしくて、巨大なブロックを空から落としては中を観察している。中に閉じこめられた相手は目が見えず、力も使えなくなる。本人には悪気がまったくない。", "relations": [{"with": "wormhole", "kind": "研究仲間", "text": "Astro とは宇宙の話で盛り上がる。Astro のゲートの研究に、こっそり協力している。"}, {"with": "byte", "kind": "通信相手", "text": "母星との通信に Byte の画面を借りている。そのお礼に試合では手加減しているらしい。"}], "good": [{"vs": "splash", "why": "速さが命の相手を、ブロックで止めてユニークを封じられる。"}, {"vs": "jack", "why": "跳ぶ前に閉じこめれば、大ジャンプで逃げられない。"}], "bad": [{"vs": "widow", "why": "40マス先に糸を刺して、ブロックの外へ一気に逃げられる。"}, {"vs": "replica", "why": "分身にブロックを使ってしまうと、12秒のクールタイムが空ぶりになる。"}], "tech": ["ブロックの中の相手は盲目でユニークが使えない。閉じこめたら、ふちの外から落ち着いて撃つ。", "自分にはブロックが見えない(ふちだけ見える)。ふちを目印に、出てくる場所に矢を置く。", "逃げ道をふさぐ使い方もできる。狭い通路にブロックを置いて、相手を回り道させる。"], "counter": ["閉じこめられたら、まっすぐ一方向に走ってすぐ出る。盲目でも動ける。", "クールタイムは12秒。使った直後に攻める。", "Widow・Echo・Astro のように遠くへ動ける相手は、ブロックから逃げやすい。"]}, "oracle": {"role": "索敵", "difficulty": 3, "catch": "壁の向こうを見通す、骨の占い師", "lore": "骨の体を持つ占い師。手をかざすと、まわりの壁が透けて、隠れている相手の姿だけが光って見える。占いの的中率はほぼ100%。ただし占えるのは「誰がどこに隠れているか」だけで、明日の天気はわからない。", "relations": [{"with": "shade", "kind": "天敵", "text": "Shade の透明は Oracle には通じない。Shade からいちばん嫌われている。"}, {"with": "echo", "kind": "同業者", "text": "目に見えないものを見る者どうし。Echo は音、Oracle は骨で感じる。たまに見え方の話で盛り上がる。"}], "good": [{"vs": "shade", "why": "範囲の中では透明でも光って見える。鎧がない Shade を1発で倒せる。"}, {"vs": "replica", "why": "本物だけが光るので、分身にだまされない。"}], "bad": [{"vs": "splash", "why": "見えていても速すぎて当たらない。8秒の間は範囲の外へ出られてしまう。"}, {"vs": "wormhole", "why": "ゲートで範囲の外へ一瞬で抜けられる。"}], "tech": ["範囲の中では自分の矢がブロックを通り抜ける。壁の向こうの光った相手を、壁ごしに撃てる。", "範囲は見ている所のまわり半径7。相手が隠れていそうな建物の中心を見て使う。", "8秒しかない。使う前に弓を引いておくと、見えた瞬間に撃てる。"], "counter": ["Oracle に見られたら、範囲(半径7)の外へ走る。8秒で終わる。", "壁ごしに撃たれるので、壁は盾にならない。距離を取る。", "クールタイムは15秒。使った後は見えない。"]}, "echo": {"role": "移動", "difficulty": 4, "catch": "音で見て、シュルカーに飛ぶコウモリ", "lore": "真っ暗な洞窟で育ったコウモリ。目はあまり見えないが、音のはね返りでまわりのすべてがわかる。4匹のシュルカーを放って、好きな所へ一瞬で移る。移った先では大きな音で相手の目をくらませる。", "relations": [{"with": "widow", "kind": "夜の友だち", "text": "同じ洞窟の幼なじみ。Widow の糸にぶら下がって寝るのが好き。"}, {"with": "humming", "kind": "苦手", "text": "昼型の Humming とは時間が合わない。羽音がうるさいとも思っている。"}], "good": [{"vs": "shade", "why": "転移した先の相手を盲目にできる。暗い視界の Shade はほとんど何も見えなくなる。"}, {"vs": "meteor", "why": "シュルカーへ転移して、ブロックの外へ一瞬で出られる。"}], "bad": [{"vs": "pierce", "why": "転移した先にハリネズミが走っていると、ノックバックで島から押し出される。"}, {"vs": "oracle", "why": "転移しても範囲の中なら光って見え、出てくる所をねらわれる。"}], "tech": ["4方向のシュルカーのどれかを見ながらもう一度使うと転移。時間内なら続けて残りにも転移できる。", "アイテムを持って殴ると残りを回収。残した数が多いほどクールタイムが短い(3〜18秒)。1回だけ使って回収すれば、すぐ次が使える。", "転移した先のまわりの相手は盲目になる。転移して → すぐ撃つ、を1セットで練習する。"], "counter": ["シュルカーが飛んだ方向を見ておく。転移してくる場所はその4か所のどれか。", "盲目は数秒。目がくらんだら下がって時間をかせぐ。", "使い切った後のクールタイムは最大18秒。全部使ったのを見たら攻める。"]}, "pierce": {"role": "攻撃", "difficulty": 2, "catch": "3匹のハリネズミと戦う、トゲの子", "lore": "3匹のハリネズミをいつも連れている子ども。ハリネズミたちは主人のまわりを走り回り、合図ひとつで丸まって相手に飛んでいく。当たると鎧も割れる。投げたハリネズミは15秒すると、ちゃんと戻ってくる。", "relations": [{"with": "rampart", "kind": "守りの話", "text": "トゲで守る Pierce と、こうらで守る Rampart。どっちの守りが上か、よく言い合っている。"}, {"with": "chef", "kind": "まかない係", "text": "ハリネズミのエサは Olive のピザの耳。試合の後はいつも Olive の店に寄る。"}], "good": [{"vs": "widow", "why": "振り子の道すじにハリネズミを投げれば、糸の外へはじき出せる。"}, {"vs": "echo", "why": "転移してきた所にハリネズミが走っていれば、ノックバックで押し出せる。"}], "bad": [{"vs": "jack", "why": "島から押し出しても、大ジャンプで戻ってくる。"}, {"vs": "shade", "why": "見えない相手にはハリネズミをねらって投げられない。"}], "tech": ["当たった相手が鎧を着ていたら鎧が壊れる。ハリネズミで鎧を割ってから矢で仕上げる。", "島のはしにいる相手に投げると、ノックバックで落とせる。", "3匹投げると15秒後に全員戻る。1匹ずつ投げて、いつも何匹か残しておく。"], "counter": ["まわりを走るハリネズミの数を見る。0匹なら15秒は投げてこない。", "島のはしで向かい合わない。押し出される。", "高い所から撃つ。ハリネズミは地面を走る。"]}, "wormhole": {"role": "移動", "difficulty": 4, "catch": "2つのゲートをつなぐ、天才発明家", "lore": "宇宙研究所から来た若い発明家。手作りのポータルガンで、2つのゲートをつないで行き来できる。敵もゲートを使えてしまうのは「仕様」だと言いはっている。試合はゲートの実験の場だと思っている。", "relations": [{"with": "meteor", "kind": "研究仲間", "text": "宇宙人の Meteor とは話が合う。ゲートで星まで行けないか、2人で研究中。"}, {"with": "byte", "kind": "機械好き", "text": "Byte の体の中身に興味しんしん。分解させてほしいと毎回たのんで断られている。"}], "good": [{"vs": "oracle", "why": "見つかっても、ゲートで範囲の外へ一瞬で抜けられる。"}, {"vs": "meteor", "why": "ブロックが来る前にゲートを置いておけば、閉じこめられても外へ出られる。"}], "bad": [{"vs": "jester", "why": "ゲートに入る直前に入れ替えられると、置いたゲートを相手に使われる。"}, {"vs": "pierce", "why": "ゲートから出た所は読まれやすく、ハリネズミを置かれる。"}], "tech": ["くぐると向きと勢いを保ったまま出てくる。高い所から落ちてゲートに入れば、勢いよく飛び出せる。", "矢もゲートをくぐる。ゲートの向こうの相手を、こちらから撃てる。", "ゲートは12秒。逃げ道を先に作っておいて、危なくなったら飛びこむ。"], "counter": ["敵のゲートは自分も使える。くぐって後ろを取る。", "片方のゲートの前で待てば、出てきた所を撃てる。", "クールタイムは20秒と長い。2つ置いた後はしばらく何もできない。"]}, "rampart": {"role": "防御", "difficulty": 1, "catch": "倒すほど固くなる、カメの鎧職人", "lore": "代々続く鎧職人の家のカメ。相手を倒すたびに、その場で鎧を打ち直して身につける。金ブロックがあれば、5秒で新しい鎧を作れる(1試合に1回だけ)。のんびりしているが、守りに入ると誰より固い。", "relations": [{"with": "pierce", "kind": "守りの話", "text": "こうらとトゲ、どっちが強いかで言い合いになる。結論はまだ出ていない。"}, {"with": "mason", "kind": "のんびり仲間", "text": "Sprout とは話すテンポが同じ。2人で話していると、試合の開始を聞き逃す。"}], "good": [{"vs": "splash", "why": "速さで攻めてくる相手にも、鎧をため直して耐えられる。"}, {"vs": "pierce", "why": "ハリネズミで鎧を割られても、倒した相手から鎧をもらってすぐ戻せる。"}], "bad": [{"vs": "jester", "why": "金ブロックの上で鎧をためている所を入れ替えられると、ためが無駄になる。"}, {"vs": "widow", "why": "動きが少ない分、真上や後ろから振り子で回りこまれやすい。"}], "tech": ["敵を倒すと鎧がもらえる。連続で倒せば、ずっと2発の体力で戦える。", "金ブロックの上で使うと5秒ためて鎧を作れる(1試合1回)。安全な金ブロックの場所を先に覚えておく。", "クールタイムがない。ためる5秒の間だけ、まわりに注意する。"], "counter": ["金ブロックの上で動かずにいたら、ためている合図。今すぐ撃つ。", "一度に2発当てて、鎧をもらう前に倒し切る。", "Jester がいれば、ためている最中に入れ替えて台なしにできる。"]}, "mason": {"role": "地形", "difficulty": 2, "catch": "竹の柱を生やす、のんびりパンダ", "lore": "竹林の奥で暮らすパンダ。地面から竹の柱を生やすことができ、足場にも盾にもする。柱を使った壁蹴りではお腹がすかないらしく、一日じゅう柱の上で過ごしている。本人の目標は「大会の島を竹林にすること」。", "relations": [{"with": "humming", "kind": "ご近所", "text": "竹林の近くに Humming の巣がある。柱の上で一緒にひなたぼっこする仲。"}, {"with": "chef", "kind": "料理の話", "text": "竹の子をピザに乗せてみようと Olive に提案中。まだ実現していない。"}], "good": [{"vs": "pierce", "why": "柱で地面のハリネズミの道をふさいだり、柱の上に逃げたりできる。"}, {"vs": "oracle", "why": "壁が透けても、柱は矢をふせぐ盾になる(ぶつかるのはそのまま)。"}], "bad": [{"vs": "byte", "why": "Byte は乗っ取ったブロックで速く動き回り、柱の守りを回りこんでくる。"}, {"vs": "wormhole", "why": "柱で守っても、ゲートで後ろに回りこまれる。"}], "tech": ["しゃがんで使うか足元を見て使うと、自分の真下から柱が生えて高い所へ持ち上がる。高い所を一瞬で取れる。", "柱は3本までためておけて、10秒ごとに1本戻る。4本目を立てると一番古い柱が消える。", "柱でのウォールキックは食料ゲージが減らない。柱2本の間でウォールキックを続けて高い所へ。"], "counter": ["柱の上の Sprout は逃げ場が少ない。柱のふちをねらう。", "柱は3本まで。立てた本数を数えておく。", "柱の陰に隠れられたら、横に回りこむ。"]}, "byte": {"role": "移動", "difficulty": 3, "catch": "ブロックを乗っ取る、テレビの機械", "lore": "捨てられたテレビに命が宿った機械。まわりのダイヤブロックとエメラルドブロックを乗っ取って、自分だけの道に変えてしまう。ふだんは画面に天気予報を流しているが、試合になると緑のコードがびっしり流れる。", "relation       <div class="card"><span class="k">TEAM</span><b>チーム戦</b><p>赤と青の2チームに分かれて戦う。</p></div>
      <div class="card"><span class="k">DUEL</span><b>1対1</b><p>2本先取のタイマン。通常マッチと同時に遊べる。</p></div>
      <div class="card"><span class="k">PRACTICE</span><b>練習場・AIM練習場</b><p>ユニークのお試しとキャラコンのコース。AIM練習場は30秒の的あてでランキングつき。</p></div></div>`),
  progress: () => {
    const R = G.ranks;
    set('ランク・熟練度', `<p class="crumb"><a href="#/">WIKI</a> / RANK</p><h1 class="t">Rank & <i>Mastery</i></h1><p class="lead">ランクは試合の成績で上下するポイント。熟練度はユニークごとに、当てた数で上がっていく。</p>
      <h2 class="s">ランク <small>Rank</small></h2><div class="tbl-wrap"><table class="tbl"><thead><tr><th>段</th><th>必要ポイント</th></tr></thead><tbody>${R.map((r, i) => `<tr><td><b>${esc(r.label)}</b>${i === R.length - 1 ? ' <span class="rar" style="color:var(--gold)">最上位</span>' : ''}</td><td class="num">${r.min.toLocaleString()} PT〜</td></tr>`).join('')}</tbody></table></div>
      <p class="empty" style="font-size:13.5px">${esc(R[R.length - 1].label)}の中でワールド1位の人はチャンピオン。</p>
      <h2 class="s">熟練度 <small>Mastery</small></h2><div class="tbl-wrap"><table class="tbl"><thead><tr><th>熟練度</th><th>必要ヒット数(そのユニークで)</th></tr></thead><tbody>${G.grades.map(g => `<tr><td class="num">${esc(g.id)}</td><td>${g.min.toLocaleString()} ヒット${g.wins ? ` + そのユニークで ${g.wins.toLocaleString()} 勝` : ''}</td></tr>`).join('')}</tbody></table></div>
      <p class="empty" style="font-size:13.5px">熟練度が上がると専用のスキン・バッジがもらえる。</p>`);
  },
  cosmetics: tab => {
    const T = [['titles', '称号'], ['pets', 'ペット'], ['emotes', 'エモート'], ['symbols', 'キルフィード記号'], ['hitfx', '当てた時の照準'], ['badges', 'バッジ']];
    const t = T.find(x => x[0] === tab)?.[0] ?? 'titles';
    const rar = id => { const r = G.rarity[id]; if (!r) return ''; const c = { common: '#cfd2dc', uncommon: '#7fe07a', rare: '#5a9aff', epic: '#b26bff', legend: '#ffc446', mythic: '#ff7ac8', super_legend: '#ffd84a' }[id] ?? '#ccc'; return `<span class="rar" style="color:${c}">${esc(r.label)}</span>`; };
    const how = x => x.obtainNote ?? x.how ?? (typeof x.price === 'number' ? (x.price ? `${x.price.toLocaleString()} コイン` : '無料') : (x.obtain ? '特別な方法で入手' : '-'));
    const list = G[t] ?? [];
    set('コスメ', `<p class="crumb"><a href="#/">WIKI</a> / COSMETICS</p><h1 class="t">Cosme<i>tics</i></h1><p class="lead">見た目だけで、強さは変わらない。ショップ・ガチャ・ミッション・ランクなどで手に入る。</p>
      <div class="tabs">${T.map(([k, l]) => `<button aria-pressed="${k === t}" onclick="location.hash='#/cosmetics/${k}'">${l}</button>`).join('')}</div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>名前</th><th>レア度</th><th>手に入れ方</th></tr></thead><tbody>${list.map(x => `<tr><td><b>${esc(x.label)}</b>${x.desc ? `<br><span class="empty" style="font-size:13px">${esc(x.desc)}</span>` : ''}</td><td>${rar(x.rarity)}</td><td>${esc(how(x))}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">まだない</td></tr>'}</tbody></table></div>
      <p class="empty" style="font-size:13.5px">マントは準備中。</p>`);
  },
};
function route() {
  const [, a = '', b] = (location.hash || '#/').split('/');
  document.querySelectorAll('#nav a[data-r]').forEach(x => x.classList.toggle('on', x.dataset.r === a || (a === 'u' && x.dataset.r === 'uniques')));
  (PAGES[a] ?? PAGES[''])(b ? decodeURIComponent(b) : undefined);
  $('#hd').classList.remove('open'); $('#menu-btn').setAttribute('aria-expanded', 'false');
}
// 検索: ユニークの名前・モチーフ・説明・ストーリー・テクニック、コスメの名前
function search(q) {
  q = q.trim().toLowerCase(); const r = $('#res');
  if (!q) { r.hidden = true; return; }
  const hits = [];
  for (const u of U()) { const w = W.uniques[u.id] ?? {}; const txt = [u.name, u.motif, u.desc, w.catch, w.lore, ...(w.tech ?? []), ...(w.counter ?? [])].join(' ').toLowerCase(); if (txt.includes(q)) hits.push(`<a href="#/u/${u.id}"><img class="px" src="${head(u.id)}" alt="">${esc(u.name)}<small>ユニーク</small></a>`); }
  for (const [k, l] of [['titles', '称号'], ['pets', 'ペット'], ['emotes', 'エモート'], ['badges', 'バッジ']]) for (const x of G[k] ?? []) if (String(x.label).toLowerCase().includes(q)) hits.push(`<a href="#/cosmetics/${k}">${esc(x.label)}<small>${l}</small></a>`);
  r.innerHTML = hits.slice(0, 20).join('') || '<a>見つからなかった</a>'; r.hidden = false;
}
$('#q').addEventListener('input', e => search(e.target.value));
$('#res').addEventListener('click', () => { $('#res').hidden = true; $('#q').value = ''; });
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('#res').hidden = true; });
$('#menu-btn').onclick = () => { const o = $('#hd').classList.toggle('open'); $('#menu-btn').setAttribute('aria-expanded', String(o)); };
Promise.all([load('game'), load('uniques')]).then(([g, w]) => { G = g; W = w; addEventListener('hashchange', route); route(); });
</script>
</body>
</html>
