<title>浮島の採石場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@400;700&display=swap">
<style>
/* 空の上に浮かぶ島を、そのまま全画面で回して見る。操作は下の帯にまとめる(空の色で固定。テーマで変えない) */
:root{
  --sky-top:#5fa8e8; --sky-bot:#cfe8f7; --ink:#10233a; --panel:rgba(255,255,255,.86); --line:rgba(16,35,58,.16);
  --emerald:#22c06a; --diamond:#3fd9d0; --spawn:#ff4fb8; --danger:#ff3b3b; --accent:#f0a91a;
  --display:"Dela Gothic One","Hiragino Sans",sans-serif; --body:"M PLUS 1p","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky-bot);color:var(--ink);font-family:var(--body);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:flex-start;justify-content:space-between;pointer-events:none;flex-wrap:wrap}
.name{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;backdrop-filter:blur(6px);pointer-events:auto;min-width:0}
.name h1{font-family:var(--display);font-weight:400;font-size:22px;margin:0;letter-spacing:.03em;text-wrap:balance}
.name p{margin:2px 0 0;font-size:12.5px;color:#43566e}
.legend{display:flex;flex-wrap:wrap;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;pointer-events:auto;font-size:12.5px;max-width:420px}
.legend span{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;background:rgba(16,35,58,.06)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;pointer-events:auto;backdrop-filter:blur(6px);max-width:100%}
.row button{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:10px;padding:7px 12px;background:transparent;color:var(--ink);cursor:pointer}
.row button:hover{background:rgba(16,35,58,.08)}
.row button[aria-pressed="true"]{background:var(--ink);color:#fff}
.row button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12px;color:#43566e;background:var(--panel);border-radius:999px;padding:3px 12px;pointer-events:auto}
#load[hidden]{display:none}
#load{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--ink)}
</style>

<canvas id="c" aria-label="浮島の採石場の 3D プレビュー"></canvas>
<div id="load">組み立て中…</div>
<div class="top">
  <div class="name"><h1>浮島の採石場</h1><p id="stat">ドラッグで回す・ホイール/ピンチで寄る</p></div>
  <div class="legend">
    <span><i style="background:var(--emerald)"></i>エメラルド = アップドラフト</span>
    <span><i style="background:var(--diamond)"></i>ダイヤ = ブリンク</span>
    <span><i style="background:var(--spawn)"></i>スポーン地点</span>
    <span><i style="background:var(--danger)"></i>高度オーバー(葉の上)</span>
  </div>
</div>
<div class="bar">
  <div class="hint" id="hint">全体</div>
  <div class="row" role="group" aria-label="カメラ">
    <button id="v-all" aria-pressed="true">全体</button>
    <button id="v-top" aria-pressed="false">上から</button>
    <button id="v-tree" aria-pressed="false">巨大な木</button>
    <button id="v-pit" aria-pressed="false">穴の底</button>
    <button id="v-under" aria-pressed="false">島の裏</button>
    <button id="v-eye" aria-pressed="false">プレイヤー目線 ▶</button>
  </div>
  <div class="row" role="group" aria-label="表示">
    <button id="t-pads" aria-pressed="true">キャラコン床</button>
    <button id="t-spawn" aria-pressed="true">スポーン地点</button>
    <button id="t-danger" aria-pressed="false">高度オーバー</button>
  </div>
</div>

  camera.position.set(-84, 66, -96); controls.target.set(2, -3, 4); camera.fov = 40; camera.updateProjectionMatrix();
}
document.getElementById('stat').textContent = `ブロック ${total.toLocaleString()}個を表示・ドラッグで回す / ホイール・ピンチで寄る`;
document.getElementById('load').hidden = true;

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
renderer.setAnimationLoop(now => {
  if (anim) {
    const t = Math.min(1, (now - anim.t0) / (reduce ? 1 : anim.dur)), e = ease(t);
    camera.position.lerpVectors(anim.p0, anim.p1, e); controls.target.lerpVectors(anim.a0, anim.a1, e);
    if (t >= 1) anim = null;
  }
  if (!reduce) beams.forEach((b, i) => { b.material.opacity = 0.22 + 0.16 * Math.sin(now / 400 + i); });
  controls.update(); renderer.render(scene, camera);
});
</script>
